    post:
      consumes:
      - application/json
      description: Call after the browser's PUT to the presigned URL from POST /batches/{short_id}/recordings/presign
        succeeds. Verifies the object actually landed in R2 (HeadObject, so a failed/aborted
        upload can't be registered) and creates the batch_recordings row students
        see immediately.
      parameters:
      - description: Batch short ID
        in: path
        name: short_id
        required: true
