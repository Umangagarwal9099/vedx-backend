            $ref: '#/definitions/models.BatchRecording'
        "400":
          description: Upload did not complete
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Batch not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a presigned-uploaded batch recording
      tags:
      - sessions
  /batches/{short_id}/recordings/presign:
    post:
      consumes:
