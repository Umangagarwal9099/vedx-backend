      follow_ups_done:
        type: integer
      id:
        type: string
      leads_contacted:
        type: integer
      report_date:
        type: string
      short_id:
        type: string
      summary:
        type: string
      updated_at:
        type: string
    type: object
  models.WorkReportSuggestions:
    properties:
      admissions:
        type: integer
      calls_made:
        type: integer
      follow_ups_done:
        type: integer
      leads_contacted:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: umangagarwal9099@gmail.com
    name: Umang Agarwal
  description: 'Vedex backend API. Authenticate via POST /api/v1/auth/login to get
    a JWT, then pass it as `Authorization: Bearer <token>` on protected endpoints.'
  title: Vedex API
  version: "1.0"
paths:
  /analytics/batches:
    get:
      description: Returns one row per batch — student count, average completion %,
        average attendance rate, an attendance-based at-risk count, and certificates
        issued. Mentors/employees see only batches they manage.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BatchAnalyticsRow'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch & Progress analytics
      tags:
      - analytics
  /analytics/batches/{short_id}/attendance-trend:
    get:
      description: Returns average attendance % per week for one batch, oldest first.
      parameters:
      - description: Batch short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BatchAttendanceTrendPoint'
            type: array
        "404":
          description: Batch not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch attendance trend
      tags:
      - analytics
  /announcements:
    get:
      description: 'Returns all non-deleted announcements. Use query params to filter:
        name (partial match), urgency (low|medium|high), is_active (true|false).'
      parameters:
      - description: Filter by name (case-insensitive, partial match)
        in: query
        name: name
        type: string
      - description: 'Filter by urgency: low | medium | high'
        in: query
        name: urgency
        type: string
      - description: 'Filter by status: true | false'
        in: query
        name: is_active
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Announcement'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List announcements
      tags:
      - announcements
    post:
      consumes:
      - application/json
      description: Create a new announcement. Description supports rich text (HTML/Markdown).
        Use POST /upload/image first to get the image_url.
      parameters:
      - description: Announcement details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateAnnouncementInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Announcement'
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create announcement
      tags:
      - announcements
  /announcements/{short_id}:
    delete:
      description: Soft-delete an announcement by its short_id (sets deleted_at; the
        row is retained).
      parameters:
      - description: Announcement short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Announcement not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete announcement
      tags:
      - announcements
    patch:
      consumes:
      - application/json
      description: Partially update an announcement by its short_id. Send only the
        fields you want to change.
      parameters:
      - description: Announcement short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAnnouncementInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Announcement'
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Announcement not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update announcement
      tags:
      - announcements
  /assessments:
    get:
      description: Returns assessments scoped to the caller's role — students see
        active global assessments plus ones for their enrolled batches; mentors see
        global plus their managed batches; team_lead/super_admin see everything (with
        optional name/description/is_active/batch_short_id filters).
      parameters:
      - description: Filter by name (partial match)
        in: query
        name: name
        type: string
      - description: Filter by description (partial match)
        in: query
        name: description
        type: string
      - description: 'Filter by active status: true or false'
        in: query
        name: is_active
        type: string
      - description: Filter by batch short ID
        in: query
        name: batch_short_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Assessment'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List assessments
      tags:
      - assessments
    post:
      consumes:
      - application/json
      description: Create a new assessment — either static content (leave start_at/end_at/duration_minutes
        unset) or a real timed exam. Attach questions afterwards via POST /assessments/{short_id}/questions.
        Leave batch_short_id empty for global visibility. Upload thumbnail via POST
        /upload/assessment-thumbnail and files via POST /upload/assessment-file first,
        then pass the returned URLs here.
      parameters:
      - description: Assessment details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateAssessmentInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Assessment'
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create assessment
      tags:
      - assessments
  /assessments/{short_id}:
    delete:
      description: Soft-deletes an assessment by its short ID. The record is retained
        in the database with deleted_at set.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete assessment
      tags:
      - assessments
    get:
      description: Returns a single assessment by its short_id.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Assessment'
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get assessment
      tags:
      - assessments
    patch:
      consumes:
      - application/json
      description: Partially update an assessment. All fields are optional — only
        provided fields are updated. To replace files, upload new ones via POST /upload/assessment-file
        and pass the full updated file_urls array. To replace the thumbnail, upload
        via POST /upload/assessment-thumbnail.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAssessmentInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Assessment'
        "400":
          description: Validation error or no fields provided
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update assessment
      tags:
      - assessments
  /assessments/{short_id}/access-status:
    get:
      description: The single source of truth the student frontend must render Start/Resume/Closed/Missed/Submitted
        state from — do not recompute this client-side. Returns can_start, can_resume,
        display_status, reason, attempt_status, starts_at, ends_at.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ExamAccessStatus'
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resolve exam access/display status
      tags:
      - exam-attempts
  /assessments/{short_id}/attempts:
    get:
      description: Returns every attempt at an assessment across all students, for
        monitoring and grading. Restricted to super_admin / team_lead / mentor.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ExamAttempt'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all attempts
      tags:
      - exam-attempts
    post:
      description: Starts a new timed attempt at an assessment, or resumes the caller's
        existing in-progress attempt. Enforces the assessment's start/end window and
        max_attempts. Returns the attempt with its (possibly randomized) question
        list, sanitized of correct answers.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AttemptDetail'
        "400":
          description: Outside the exam window, or attempts exhausted
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Start (or resume) an exam attempt
      tags:
      - exam-attempts
  /assessments/{short_id}/attempts/{attempt_short_id}:
    get:
      description: Returns a single attempt with its full question list. Correct answers
        are only included once the attempt is finished and the assessment allows revealing
        them.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Attempt short ID
        in: path
        name: attempt_short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AttemptDetail'
        "404":
          description: Attempt not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get attempt detail
      tags:
      - exam-attempts
  /assessments/{short_id}/attempts/{attempt_short_id}/answers:
    post:
      consumes:
      - application/json
      description: Saves (or overwrites) the caller's answer to one question within
        their in-progress attempt. Call this on every change — it's cheap to call
        repeatedly.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Attempt short ID
        in: path
        name: attempt_short_id
        required: true
        type: string
      - description: Answer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.SubmitAnswerInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Validation error, or attempt is no longer in progress
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Autosave an answer
      tags:
      - exam-attempts
  /assessments/{short_id}/attempts/{attempt_short_id}/answers/{question_short_id}/grade:
    patch:
      consumes:
      - application/json
      description: Records marks and feedback for a short_answer/descriptive/coding
        answer within a submitted attempt. Once every answer in the attempt has a
        grade, the attempt automatically flips to "evaluated" with its total score
        and pass/fail computed. Restricted to super_admin / team_lead / mentor.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Attempt short ID
        in: path
        name: attempt_short_id
        required: true
        type: string
      - description: Question short ID
        in: path
        name: question_short_id
        required: true
        type: string
      - description: Grade details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.GradeAnswerInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Manually grade an answer
      tags:
      - exam-attempts
  /assessments/{short_id}/attempts/{attempt_short_id}/submit:
    post:
      description: Finalizes the caller's attempt. Objective questions (mcq/multi_select/true_false/fill_blank)
        are auto-graded immediately; if the assessment has no other question types,
        the attempt is fully evaluated right away. Otherwise it's marked "submitted"
        pending manual grading of descriptive/coding answers.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Attempt short ID
        in: path
        name: attempt_short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AttemptDetail'
        "404":
          description: Attempt not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit an attempt
      tags:
      - exam-attempts
  /assessments/{short_id}/attempts/{attempt_short_id}/violations:
    post:
      consumes:
      - application/json
      description: Records a proctoring-integrity event (tab switch, fullscreen exit,
        etc.) for an in-progress attempt. Applies the assessment's configured thresholds
        — allowed_warning_count and auto_submit_on_violation — and auto-submits the
        attempt once the threshold is reached. A normal browser cannot fully prevent
        a student from leaving the exam; this only detects and responds to what the
        browser can observe.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Attempt short ID
        in: path
        name: attempt_short_id
        required: true
        type: string
      - description: Violation details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RecordViolationInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RecordViolationResponse'
        "400":
          description: Validation error, or attempt is no longer in progress
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Attempt not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Report an exam-integrity violation
      tags:
      - exam-attempts
  /assessments/{short_id}/attempts/me:
    get:
      description: Returns the calling student's attempts at an assessment, newest
        first.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ExamAttempt'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List my attempts
      tags:
      - exam-attempts
  /assessments/{short_id}/cancel:
    post:
      description: Cancels an assessment — blocks any new attempt and marks every
        currently in-progress attempt as cancelled. Existing submitted/evaluated attempts
        are untouched. Restricted to super_admin / team_lead / mentor (of a batch
        they manage).
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel an assessment
      tags:
      - assessments
  /assessments/{short_id}/publish-results:
    post:
      description: Makes every graded attempt's marks/grade/pass-fail visible to students
        at once. Grading itself never publishes — this is a deliberate, separate action
        so a mentor can grade over time and reveal to the whole class together. Restricted
        to super_admin / team_lead / mentor (of a batch they manage).
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Publish this assessment's results
      tags:
      - assessments
  /assessments/{short_id}/questions:
    get:
      description: Returns every question attached to an assessment, in display order.
        Restricted to super_admin / team_lead / mentor (students never see the raw
        question bank with answers — they get a sanitized view via the attempt endpoints).
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AssessmentQuestion'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List assessment questions
      tags:
      - assessments
    post:
      consumes:
      - application/json
      description: Attaches an existing question-bank entry (see POST /questions)
        to an assessment, with a display order and optional marks override. Restricted
        to super_admin / team_lead / mentor.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Question to attach
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AttachQuestionInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Attach question to assessment
      tags:
      - assessments
  /assessments/{short_id}/questions/{question_short_id}:
    delete:
      description: Removes a question from an assessment (the question itself remains
        in the bank). Restricted to super_admin / team_lead / mentor.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Question short ID
        in: path
        name: question_short_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Detach question from assessment
      tags:
      - assessments
    patch:
      consumes:
      - application/json
      description: Updates the display order or marks override for a question already
        attached to an assessment. Restricted to super_admin / team_lead / mentor.
      parameters:
      - description: Assessment short ID
        in: path
        name: short_id
        required: true
        type: string
      - description: Question short ID
        in: path
        name: question_short_id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAttachedQuestionInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update attached question
      tags:
      - assessments
  /assessments/{short_id}/reattempts:
    post:
      consumes:
      - application/json
