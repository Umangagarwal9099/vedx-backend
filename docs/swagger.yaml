    - lead_short_ids
    type: object
  models.Assignment:
    properties:
      allowed_file_formats:
        items:
          type: string
        type: array
      allowed_submission_types:
        items:
          type: string
        type: array
      batch_id:
        type: string
      batch_number:
        type: string
      batch_short_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      created_by_name:
        type: string
      deadline:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      late_penalty_percent:
        type: integer
      late_submission_allowed:
        type: boolean
      max_file_size_mb:
        type: integer
      max_marks:
        type: integer
      module_name:
        type: string
      module_short_id:
        type: string
      pending_review_count:
        type: integer
      session_name:
        type: string
      session_short_id:
        type: string
      short_id:
        type: string
      status:
        description: draft | active | closed
        type: string
      submission_count:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.AssignmentSubmission:
    properties:
      assignment_short_id:
        type: string
      assignment_title:
        description: |-
          AssignmentTitle/BatchShortID/BatchNumber are only populated by the
          cross-assignment workspace listing (FindAllSubmissionsForMentor).
        type: string
      batch_number:
        type: string
      batch_short_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      evaluated_at:
        type: string
      evaluated_by:
        type: string
      feedback:
        type: string
      file_url:
        type: string
      id:
        type: string
      marks:
        type: integer
      result_published_at:
        description: |-
          ResultPublishedAt gates student-visible marks/grade/feedback — set only
          by the explicit bulk "publish results" action, never by grading itself.
        type: string
      short_id:
        type: string
      status:
        description: submitted | late | evaluated | resubmission_required
        type: string
      student_email:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      submission_type:
        description: link | text | file
        type: string
      submitted_at:
        type: string
      updated_at:
        type: string
    type: object
  models.AtRiskStudent:
    properties:
      attendance_percentage:
        type: number
      current_streak:
        type: integer
      days_inactive:
        type: integer
      final_score:
        type: number
      reasons:
        items:
          type: string
        type: array
      student_id:
        type: string
      student_name:
        type: string
    type: object
  models.AttachQuestionInput:
    properties:
      marks_override:
        example: 10
        type: integer
      order_index:
        example: 1
        type: integer
      question_short_id:
        example: use GET /questions to pick a real short_id
        type: string
    required:
    - question_short_id
    type: object
  models.AttemptDetail:
    properties:
      assessment_name:
        description: |-
          AssessmentName/BatchShortID/BatchNumber are only populated by the
          cross-assessment workspace listing (FindAllAttemptsForMentor).
        type: string
      assessment_short_id:
        type: string
      attempt_number:
        type: integer
      auto_submitted:
        type: boolean
      batch_number:
        type: string
      batch_short_id:
        type: string
      ends_at:
        type: string
      id:
        type: string
      max_score:
        type: integer
      passed:
        type: boolean
      questions:
        items:
          $ref: '#/definitions/models.AttemptQuestionView'
        type: array
      short_id:
        type: string
      started_at:
        type: string
      status:
        description: in_progress | submitted | evaluated | cancelled
        type: string
      student_id:
        type: string
      student_name:
        type: string
      submission_type:
        description: |-
          SubmissionType records how the attempt ended: manual | timer_expired |
          violation | admin_closed | exam_window_closed. Empty while in_progress.
        type: string
      submitted_at:
        type: string
      total_score:
        type: integer
      violation_count:
        description: |-
          ViolationCount is computed at read time from exam_attempt_violations —
          not stored redundantly on the attempt row.
        type: integer
    type: object
  models.AttemptQuestionView:
    properties:
      coding_question_short_id:
        type: string
      coding_question_title:
        type: string
      correct_option_ids:
        items:
          type: string
        type: array
      correct_text:
        type: string
      explanation:
        type: string
      marks:
        type: integer
      my_answer:
        $ref: '#/definitions/models.StudentAnswer'
      options:
        items:
          $ref: '#/definitions/models.QuestionOption'
        type: array
      question_text:
        type: string
      question_type:
        type: string
      short_id:
        type: string
    type: object
  models.AttendanceRecordInput:
    properties:
      notes:
        type: string
