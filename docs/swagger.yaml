      close_on_tab_switch:
        type: boolean
      close_on_window_blur:
        type: boolean
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      duration_minutes:
        type: integer
      end_at:
        type: string
      file_url:
        type: string
      general_instructions:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      max_attempts:
        type: integer
      name:
        type: string
      negative_marking:
        type: boolean
      passing_percentage:
        type: number
      question_count:
        type: integer
      randomize_options:
        type: boolean
      randomize_questions:
        type: boolean
      requires_proctoring:
        type: boolean
      result_declaration:
        type: string
      result_display:
        type: string
      result_published_at:
        description: |-
          ResultPublishedAt gates student-visible marks/grade/feedback — set only
          by the explicit "publish results" action, never by grading itself.
        type: string
      short_id:
        type: string
      show_correct_answers:
        type: boolean
      start_at:
        type: string
      thumbnail:
