  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a 6-digit OTP to the given email if it belongs to a registered
        account. Always returns 200, whether or not the email is registered, to avoid
        leaking which emails have accounts. The OTP expires after 5 minutes.
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent if the email is registered
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Forgot password — request OTP
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies email/password for any role. On success, emails a 6-digit
        verification code (valid 5 minutes) and returns without a token — call POST
        /auth/login/verify-otp with that code to receive the JWT.
      parameters:
      - description: Email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.LoginOTPRequiredResponse'
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login (step 1 of 2) — verify credentials, send OTP
      tags:
      - auth
  /auth/login/verify-otp:
    post:
      consumes:
      - application/json
      description: 'Verifies the 6-digit code emailed by POST /auth/login and, if
        valid and unexpired, returns a JWT — send it as `Authorization: Bearer <token>`
        on protected requests. The OTP is single-use.'
      parameters:
      - description: Email and verification code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.VerifyLoginOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.LoginResponse'
        "400":
          description: Invalid or expired OTP / validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login (step 2 of 2) — verify OTP, get JWT
      tags:
      - auth
