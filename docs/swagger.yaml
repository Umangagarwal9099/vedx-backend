        type: string
      explanation:
        type: string
      id:
        type: string
      marks:
        type: integer
      marks_override:
        type: integer
      negative_marks:
        type: integer
      options:
        items:
          $ref: '#/definitions/models.QuestionOption'
        type: array
      order_index:
        type: integer
      question_text:
        type: string
      question_type:
        description: mcq | multi_select | true_false | fill_blank | short_answer |
          descriptive | coding
        type: string
      short_id:
        type: string
      subject:
        type: string
      subtopic:
        type: string
      topic:
        type: string
      updated_at:
        type: string
      visibility:
        description: private | course | global
        type: string
    type: object
  models.AssignLeadsInput:
    properties:
      employee_id:
        type: string
      lead_short_ids:
        items:
          type: string
        minItems: 1
        type: array
      next_follow_up_at:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - urgent
        type: string
